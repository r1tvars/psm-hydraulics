psm_site.settings:
  type: config_object
  label: 'PSM site settings'
  mapping:
    phone:
      type: string
      label: 'Phone number'
    email:
      type: string
      label: 'Email address'
    location:
      type: string
      label: 'Location'
    facebook_url:
      type: string
      label: 'Facebook URL'
    instagram_url:
      type: string
      label: 'Instagram URL'
    linkedin_url:
      type: string
      label: 'LinkedIn URL'
    x_url:
      type: string
      label: 'X URL'
    quote_url:
      type: string
      label: 'Request a quote link'
    footer_text:
      type: text
      label: 'Footer intro text'
