psm_site.settings:
  path: '/admin/config/system/psm-site'
  defaults:
    _form: '\Drupal\psm_site\Form\SiteSettingsForm'
    _title: 'PSM site settings'
  requirements:
    _permission: 'administer psm site settings+administer site configuration'

psm_site.search_suggest:
  path: '/psm-site/search-suggest'
  defaults:
    _controller: '\Drupal\psm_site\Controller\SearchSuggestController::suggest'
    _title: 'Search suggestions'
  requirements:
    _access: 'TRUE'
